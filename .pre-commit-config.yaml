# .pre-commit-config.yaml
# Runs on every `git commit` to prevent common mistakes.
# Update hook versions with: pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]

  # Belt-and-suspenders for the *.enc.yaml naming convention: catches a secret file
  # that was named like it's encrypted but got committed as plaintext by mistake.
  - repo: local
    hooks:
      - id: sops-encrypted
        name: verify *.enc.yaml files are actually SOPS-encrypted
        language: system
        entry: scripts/check-sops-encrypted.sh
        files: \.enc\.ya?ml$
