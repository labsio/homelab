apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s
  namespace: monitoring
spec:
  secretName: wildcard-k8s-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.k8s.thelabdesk.com"
  dnsNames:
    - "*.k8s.thelabdesk.com"
    - "k8s.thelabdesk.com"
