loki:
  enabled: true
  # isDefault: false so Prometheus (from kube-prometheus-stack) stays default.
  isDefault: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 200m
promtail:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 20m
    limits:
      memory: 128Mi
      cpu: 100m
grafana:
  enabled: false
  # Loki datasource is declared in kube-prometheus-stack values instead, to
  # avoid this deprecated chart provisioning a conflicting default datasource.
  sidecar:
    datasources:
      enabled: false
prometheus:
  enabled: false
fluent-bit:
  enabled: false
