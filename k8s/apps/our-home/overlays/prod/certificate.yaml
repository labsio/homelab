# Same wildcard certificate as every other service, issued per namespace:
# a Secret cannot be read across namespaces, so each one asks for its own copy.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s
spec:
  secretName: wildcard-k8s-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.k8s.thelabdesk.com"
  dnsNames:
    - "*.k8s.thelabdesk.com"
    - "k8s.thelabdesk.com"
